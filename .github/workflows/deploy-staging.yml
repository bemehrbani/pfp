name: Deploy Staging

on:
  push:
    branches:
      - dev
    paths-ignore:
      - '**.md'
      - 'Campaigns/**'
      - 'Makan_Ry/**'
      - 'PFPJ_Ry/**'
      - 'Archive/**'
      - 'scratch/**'
      - '.agent/**'
      - '.claude/**'
      - '.gitignore'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Staging Server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST}"
          $SSH_CMD << 'EOF'
            set -e
            cd /opt/pfp-staging
            git pull origin dev
            
            # Ensure .env.staging is used as .env and .env.production
            if [ -f .env.staging ]; then
                cp .env.staging .env.production
                cp .env.staging .env
            fi
            
            # Restart docker containers for staging
            docker compose -p pfp-staging -f docker-compose.production.yml -f docker-compose.staging.yml up -d --build
            
            # Apply migrations
            docker compose -p pfp-staging -f docker-compose.production.yml -f docker-compose.staging.yml exec -T backend python manage.py migrate --noinput
            docker compose -p pfp-staging -f docker-compose.production.yml -f docker-compose.staging.yml exec -T backend python manage.py collectstatic --noinput
            
            # Trigger initial fetch to populate the bot with fresh scrape data and clear legacies
            docker compose -p pfp-staging -f docker-compose.production.yml -f docker-compose.staging.yml exec -T backend python manage.py shell -c "from apps.campaigns.tasks import fetch_global_protests; fetch_global_protests()"
          EOF
