name: Deploy Staging

on:
  push:
    branches:
      - dev
    paths-ignore:
      - '**.md'
      - 'Campaigns/**'
      - 'Makan_Ry/**'
      - 'PFPJ_Ry/**'
      - 'Archive/**'
      - 'scratch/**'
      - '.agent/**'
      - '.claude/**'
      - '.gitignore'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Staging Server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST}"

          echo "=== Pulling latest dev code ==="
          $SSH_CMD "cd /opt/pfp-staging && git fetch origin dev && git reset --hard origin/dev"

          echo "=== Syncing staging environment ==="
          $SSH_CMD "cd /opt/pfp-staging && if [ -f .env.staging ]; then cp .env.staging .env.production && cp .env.staging .env; fi"

          echo "=== Rebuilding and restarting staging services ==="
          $SSH_CMD "cd /opt/pfp-staging && docker compose -p pfp-staging -f docker-compose.production.yml -f docker-compose.staging.yml up -d --build --remove-orphans"

          echo "=== Waiting for services to stabilize ==="
          sleep 30

          echo "=== Running migrations ==="
          $SSH_CMD "cd /opt/pfp-staging && docker compose -p pfp-staging -f docker-compose.production.yml -f docker-compose.staging.yml exec -T backend python manage.py migrate --noinput"

          echo "=== Collecting static files ==="
          $SSH_CMD "cd /opt/pfp-staging && docker compose -p pfp-staging -f docker-compose.production.yml -f docker-compose.staging.yml exec -T backend python manage.py collectstatic --noinput"

          echo "=== Verifying staging services ==="
          $SSH_CMD "cd /opt/pfp-staging && docker compose -p pfp-staging -f docker-compose.production.yml -f docker-compose.staging.yml ps"

          echo "✅ Staging deployment completed successfully!"
