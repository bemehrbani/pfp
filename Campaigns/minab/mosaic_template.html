<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 Faces of Peace — Minab Children</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a14;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            padding: 40px 20px 20px;
            background: linear-gradient(180deg, #0f0f19 0%, #0a0a14 100%);
        }

        .header h1 {
            font-size: 2.2rem;
            color: #e8be5c;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .header p {
            color: #b0b0ba;
            font-size: 1.05rem;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 16px 20px;
            margin: 10px auto 0;
            max-width: 500px;
        }

        .stat {
            text-align: center;
        }

        .stat-num {
            font-size: 2rem;
            font-weight: 800;
            color: #e8be5c;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 6px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            aspect-ratio: 0.58;
            background: #1a1a28;
        }

        .card:hover {
            transform: scale(1.08);
            z-index: 10;
            box-shadow: 0 8px 30px rgba(232, 190, 92, 0.3);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.3s ease;
        }

        .card:hover img {
            filter: brightness(1.1) contrast(1.05);
        }

        .card .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px 8px 8px;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .card:hover .overlay {
            transform: translateY(0);
        }

        .card .name {
            font-size: 0.8rem;
            font-weight: 700;
            color: #e8be5c;
        }

        .card .number {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0,0,0,0.6);
            color: #888;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .card:hover .number {
            opacity: 1;
        }

        /* Modal */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .modal-backdrop.active {
            display: flex;
        }

        .modal-content {
            max-width: 500px;
            max-height: 80vh;
            text-align: center;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 65vh;
            border-radius: 14px;
            border: 2px solid #e8be5c;
        }

        .modal-name {
            margin-top: 16px;
            font-size: 1.6rem;
            color: #e8be5c;
            font-weight: 700;
        }

        .modal-caption {
            margin-top: 8px;
            color: #b0b0ba;
            font-size: 0.95rem;
        }

        .footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid #222;
            margin-top: 30px;
        }

        .footer .cta {
            font-size: 1.3rem;
            color: #e8be5c;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .footer .hashtags {
            color: #8ca0dc;
            font-size: 0.9rem;
        }

        .footer .brand {
            color: #666;
            font-size: 0.85rem;
            margin-top: 12px;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 4px;
                padding: 10px;
            }
            .header h1 { font-size: 1.5rem; }
            .stats-bar { gap: 24px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>100 Faces of Peace</h1>
        <p>Each face is a child from Minab, Iran. Each one has a name, a dream, and a future that depends on the choices we make today.</p>
        <div class="stats-bar">
            <div class="stat">
                <div class="stat-num">100</div>
                <div class="stat-label">Children</div>
            </div>
            <div class="stat">
                <div class="stat-num">100</div>
                <div class="stat-label">Dreams</div>
            </div>
            <div class="stat">
                <div class="stat-num">1</div>
                <div class="stat-label">Demand: Peace</div>
            </div>
        </div>
    </div>

    <div class="grid" id="photoGrid"></div>

    <div class="footer">
        <div class="cta">Their futures are in your hands.</div>
        <div class="hashtags">#100FacesOfPeace · #PeopleForPeace · #MinabChildren</div>
        <div class="brand">People for Peace · 2026</div>
    </div>

    <div class="modal-backdrop" id="modal">
        <div class="modal-content">
            <img id="modalImg" src="" alt="">
            <div class="modal-name" id="modalName"></div>
            <div class="modal-caption" id="modalCaption"></div>
        </div>
    </div>

    <script>
        const captions = [
            "wants to grow up in a world without fear.",
            "dreams of going to school every day.",
            "has never known peace — but deserves it.",
            "doesn't understand why the world forgot.",
            "believes in a better tomorrow.",
            "has a smile that sanctions can't erase.",
            "is waiting for someone to care.",
            "hopes the world will listen.",
            "deserves the same chances as every other child.",
            "wants to be a doctor someday.",
        ];

        function extractName(filename) {
            const stem = filename.replace(/\.\w+$/, '');
            if (/^child_\d+$/.test(stem)) return null;
            // Check for Arabic/Farsi chars
            if (/[\u0600-\u06FF]/.test(stem)) return null;
            const parts = stem.replace(/_\d+$/, '').split('_');
            const clean = parts
                .map(p => p.replace(/[^a-zA-Z]/g, ''))
                .filter(p => p.length >= 2)
                .map(p => p.charAt(0).toUpperCase() + p.slice(1).toLowerCase());
            return clean.length > 0 ? clean.join(' ') : null;
        }

        // File list (populated by the generator script or manually)
        const photos = PHOTO_LIST_PLACEHOLDER;

        const grid = document.getElementById('photoGrid');
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modalImg');
        const modalName = document.getElementById('modalName');
        const modalCaption = document.getElementById('modalCaption');

        photos.forEach((filename, i) => {
            const name = extractName(filename);
            const displayName = name || `Child #${i + 1}`;
            const caption = `${displayName} ${captions[i % captions.length]}`;

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img src="splitted_photos/${filename}" alt="${displayName}" loading="lazy">
                <div class="overlay">
                    <div class="name">${displayName}</div>
                </div>
                <div class="number">#${i + 1}</div>
            `;
            card.addEventListener('click', () => {
                modalImg.src = `splitted_photos/${filename}`;
                modalName.textContent = displayName;
                modalCaption.textContent = caption;
                modal.classList.add('active');
            });
            grid.appendChild(card);
        });

        modal.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') modal.classList.remove('active');
        });
    </script>
</body>
</html>
